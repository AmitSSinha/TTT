<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glowing Outline Bar Chart</title>

  <style>
    @property --glow-angle {
      syntax: "<angle>";
      initial-value: 0deg;
      inherits: false;
    }

    :root {
      color-scheme: dark;
      --page-bg: #060914;
      --card-bg: #0b1020;
      --plot-bg: #0e1527;
      --text: #f7f9ff;
      --muted: #8e9ab5;
      --border: #222d47;
      --bar: #273352;
      --bar-hover: #344468;
      --cyan: #00e5ff;
      --purple: #635bff;
      --pink: #ff3cac;
      --green: #00ffb3;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 20%, rgba(76, 89, 255, 0.2), transparent 35%),
        var(--page-bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button {
      font: inherit;
    }

    .chart-card {
      width: min(100%, 760px);
      border: 1px solid var(--border);
      border-radius: 24px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.025), transparent 30%),
        var(--card-bg);
      padding: 24px;
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.38),
        inset 0 1px 0 rgba(255, 255, 255, 0.035);
    }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }

    .eyebrow {
      margin: 0 0 7px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.25;
    }

    .subtitle {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .summary {
      flex: 0 0 auto;
      border: 1px solid rgba(99, 91, 255, 0.28);
      border-radius: 14px;
      background: rgba(99, 91, 255, 0.1);
      padding: 10px 12px;
      text-align: right;
    }

    .summary strong {
      display: block;
      font-size: 18px;
    }

    .summary span {
      color: var(--muted);
      font-size: 12px;
    }

    .chart-shell {
      position: relative;
      height: 340px;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 18px;
      background:
        linear-gradient(
          to top,
          transparent 0,
          transparent calc(25% - 1px),
          rgba(142, 154, 181, 0.11) calc(25% - 1px),
          rgba(142, 154, 181, 0.11) 25%,
          transparent 25%,
          transparent calc(50% - 1px),
          rgba(142, 154, 181, 0.11) calc(50% - 1px),
          rgba(142, 154, 181, 0.11) 50%,
          transparent 50%,
          transparent calc(75% - 1px),
          rgba(142, 154, 181, 0.11) calc(75% - 1px),
          rgba(142, 154, 181, 0.11) 75%,
          transparent 75%
        ),
        var(--plot-bg);
      padding: 26px 22px 18px 54px;
    }

    .y-axis {
      position: absolute;
      inset: 22px auto 44px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: var(--muted);
      font-size: 11px;
      pointer-events: none;
    }

    .bars {
      display: grid;
      grid-template-columns: repeat(6, minmax(34px, 1fr));
      align-items: end;
      gap: clamp(12px, 4vw, 30px);
      height: 100%;
    }

    .bar-item {
      display: grid;
      grid-template-rows: 1fr auto;
      align-items: end;
      gap: 10px;
      height: 100%;
      min-width: 0;
    }

    .bar-track {
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      height: 100%;
    }

    .bar {
      --height: 60%;
      --glow-angle: 0deg;

      position: relative;
      isolation: isolate;
      width: min(100%, 58px);
      height: var(--height);
      min-height: 18px;
      border: 1px solid rgba(255, 255, 255, 0.045);
      border-radius: 13px 13px 5px 5px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.09), transparent 35%),
        var(--bar);
      cursor: pointer;
      transition:
        height 450ms cubic-bezier(.2, .75, .25, 1),
        transform 160ms ease,
        background 160ms ease;
    }

    .bar:hover {
      transform: translateY(-3px);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.1), transparent 35%),
        var(--bar-hover);
    }

    .bar:focus-visible {
      outline: 3px solid rgba(0, 229, 255, 0.3);
      outline-offset: 4px;
    }

    .bar-value {
      position: absolute;
      left: 50%;
      top: -29px;
      z-index: 3;
      transform: translateX(-50%);
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .bar-label {
      overflow: hidden;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /*
      Selected bar:
      Same principle as the original glowing button.
      The bar stays still. The complete multicolour outline changes angle.
    */
    .bar.active {
      border-color: transparent;
      background: transparent;
      box-shadow:
        0 0 10px rgba(0, 229, 255, 0.30),
        0 0 24px rgba(99, 91, 255, 0.22),
        0 0 38px rgba(255, 60, 172, 0.10);
    }

    .bar.active::before {
      content: "";
      position: absolute;
      z-index: -2;
      inset: 0;
      border-radius: inherit;
      padding: 2px;
      background: conic-gradient(
        from var(--glow-angle),
        var(--cyan),
        var(--purple),
        var(--pink),
        var(--green),
        var(--cyan)
      );

      -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;

      animation: rotate-outline-colours 2.2s linear infinite;
      pointer-events: none;
    }

    .bar.active::after {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 2px;
      border-radius: 11px 11px 3px 3px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.10), transparent 38%),
        var(--bar);
      pointer-events: none;
    }

    .bar.active .bar-value {
      color: #ffffff;
      text-shadow:
        0 0 10px rgba(0, 229, 255, 0.45),
        0 0 18px rgba(99, 91, 255, 0.26);
    }

    .legend {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-top: 17px;
      color: var(--muted);
      font-size: 13px;
    }

    .legend-swatch {
      width: 22px;
      height: 9px;
      border-radius: 999px;
      background: linear-gradient(
        90deg,
        var(--cyan),
        var(--purple),
        var(--pink),
        var(--green)
      );
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.30);
    }

    @keyframes rotate-outline-colours {
      to {
        --glow-angle: 360deg;
      }
    }

    @media (max-width: 560px) {
      body {
        padding: 14px;
      }

      .chart-card {
        padding: 17px;
        border-radius: 20px;
      }

      .card-header {
        align-items: center;
      }

      h1 {
        font-size: 19px;
      }

      .subtitle {
        font-size: 13px;
      }

      .summary {
        padding: 8px 10px;
      }

      .chart-shell {
        height: 290px;
        padding: 24px 12px 16px 42px;
      }

      .bars {
        gap: 9px;
      }

      .bar {
        width: min(100%, 42px);
      }

      .bar-label,
      .bar-value {
        font-size: 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .bar.active::before {
        animation: none;
      }

      .bar {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main class="chart-card">
    <header class="card-header">
      <div>
        <p class="eyebrow">WEEKLY PERFORMANCE</p>
        <h1>Practice accuracy</h1>
        <p class="subtitle">Click a bar to apply the glowing outline.</p>
      </div>

      <div class="summary">
        <strong>78%</strong>
        <span>Average score</span>
      </div>
    </header>

    <section class="chart-shell" aria-label="Weekly practice accuracy bar chart">
      <div class="y-axis" aria-hidden="true">
        <span>100%</span>
        <span>75%</span>
        <span>50%</span>
        <span>25%</span>
        <span>0%</span>
      </div>

      <div class="bars">
        <div class="bar-item">
          <div class="bar-track">
            <button class="bar" type="button" style="--height: 58%;" aria-label="Monday, 58 percent">
              <span class="bar-value">58%</span>
            </button>
          </div>
          <span class="bar-label">Mon</span>
        </div>

        <div class="bar-item">
          <div class="bar-track">
            <button class="bar" type="button" style="--height: 72%;" aria-label="Tuesday, 72 percent">
              <span class="bar-value">72%</span>
            </button>
          </div>
          <span class="bar-label">Tue</span>
        </div>

        <div class="bar-item">
          <div class="bar-track">
            <button class="bar" type="button" style="--height: 66%;" aria-label="Wednesday, 66 percent">
              <span class="bar-value">66%</span>
            </button>
          </div>
          <span class="bar-label">Wed</span>
        </div>

        <div class="bar-item">
          <div class="bar-track">
            <button class="bar active" type="button" style="--height: 92%;" aria-label="Thursday, 92 percent" aria-current="true">
              <span class="bar-value">92%</span>
            </button>
          </div>
          <span class="bar-label">Thu</span>
        </div>

        <div class="bar-item">
          <div class="bar-track">
            <button class="bar" type="button" style="--height: 81%;" aria-label="Friday, 81 percent">
              <span class="bar-value">81%</span>
            </button>
          </div>
          <span class="bar-label">Fri</span>
        </div>

        <div class="bar-item">
          <div class="bar-track">
            <button class="bar" type="button" style="--height: 74%;" aria-label="Saturday, 74 percent">
              <span class="bar-value">74%</span>
            </button>
          </div>
          <span class="bar-label">Sat</span>
        </div>
      </div>
    </section>

    <div class="legend">
      <span class="legend-swatch" aria-hidden="true"></span>
      <span>The selected bar keeps the original shape and gains only the glowing outline.</span>
    </div>
  </main>

  <script>
    const bars = document.querySelectorAll(".bar");

    bars.forEach((bar) => {
      bar.addEventListener("click", () => {
        bars.forEach((item) => {
          item.classList.remove("active");
          item.removeAttribute("aria-current");
        });

        bar.classList.add("active");
        bar.setAttribute("aria-current", "true");
      });
    });
  </script>
</body>
</html>
