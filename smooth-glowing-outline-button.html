<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smooth Infinite Glowing Outline Button</title>

  <style>
    @property --glow-angle {
      syntax: "<angle>";
      initial-value: 0deg;
      inherits: false;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 35%, rgba(49, 87, 255, 0.18), transparent 35%),
        #060914;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    .glow-button {
      --glow-angle: 0deg;
      --border-width: 2px;
      --radius: 16px;

      position: relative;
      isolation: isolate;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 184px;
      min-height: 56px;
      padding: 0 30px;
      border: 0;
      border-radius: var(--radius);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.06), transparent 55%),
        #0b1020;
      color: #ffffff;
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer;
      box-shadow:
        0 0 12px rgba(0, 229, 255, 0.24),
        0 0 28px rgba(99, 91, 255, 0.18),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      transition:
        transform 180ms ease,
        filter 180ms ease;
    }

    /* Stationary border: only the gradient angle changes */
    .glow-button::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0;
      border-radius: inherit;
      padding: var(--border-width);
      background: conic-gradient(
        from var(--glow-angle),
        #00e5ff,
        #635bff,
        #ff3cac,
        #00ffb3,
        #00e5ff
      );

      -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;

      animation: travel-glow 2.8s linear infinite;
      pointer-events: none;
    }

    .glow-button:hover {
      transform: translateY(-2px);
      filter: brightness(1.12);
    }

    .glow-button:active {
      transform: scale(0.98);
    }

    .glow-button:focus-visible {
      outline: 3px solid rgba(0, 229, 255, 0.4);
      outline-offset: 5px;
    }

    @keyframes travel-glow {
      to {
        --glow-angle: 360deg;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .glow-button::before {
        animation: none;
      }

      .glow-button {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <button class="glow-button" type="button">
    Explore Now
  </button>
</body>
</html>
