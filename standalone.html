  function summary(icon,label,value,foot,color,route){ return `<button class="card summary-card" style="--accent:${color};text-align:left;color:var(--text)" data-route="${route}"><span class="summary-icon">${icon}</span><span><span class="summary-label">${label}</span><strong class="summary-value">${value}</strong><span class="summary-foot"><b>${foot}</b></span></span></button>`; }

  function createPdfBlob(lines){
    const safe=lines.map(x=>String(x).replace(/[^\x20-\x7E]/g,' ').replace(/([\\()])/g,'\\$1')).slice(0,38);
    const stream=['BT','/F1 12 Tf','50 790 Td',...safe.flatMap((line,i)=>[i?'0 -18 Td':'',`(${line}) Tj`]).filter(Boolean),'ET'].join('\n');
    const objects=[
      '<< /Type /Catalog /Pages 2 0 R >>',
      '<< /Type /Pages /Kids [3 0 R] /Count 1 >>',
      '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >>',
      '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>',
      `<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`
    ];
    let pdf='%PDF-1.4\n';const offsets=[0];objects.forEach((o,i)=>{offsets[i+1]=pdf.length;pdf+=`${i+1} 0 obj\n${o}\nendobj\n`});const xref=pdf.length;pdf+=`xref\n0 ${objects.length+1}\n0000000000 65535 f \n`;for(let i=1;i<=objects.length;i++)pdf+=`${String(offsets[i]).padStart(10,'0')} 00000 n \n`;pdf+=`trailer\n<< /Size ${objects.length+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
    return new Blob([pdf],{type:'application/pdf'});
  }

      case 'refresh-admit': toast('Admit cards checked','No newer official releases were found in this demo.','success');break;
      case 'view-admit': openAdmitDetail(id);break;
      case 'download-admit': {const a=state.admitCards.find(x=>x.id===id),exam=examById(a?.examId);if(!a||!exam)return;a.downloaded=true;a.status='downloaded';const name=`${exam.code}-Admit-Card.pdf`;downloadPdf(name,[exam.name,'ADMIT CARD',`Candidate: ${state.profile.name}`,`Exam date: ${fmtDate(a.examDate)}`,`City: ${a.city}`,`Centre: ${a.centre}`,`Shift: ${a.shift}`,'Carry a printed copy and original photo identification.']);addDownload(name,'Admit Card','248 KB');save();closeModal();render();toast('Admit card downloaded',name,'success');break;}
      case 'check-result': openCheckResult();break;
      case 'view-result': openResultDetail(id);break;
      case 'download-scorecard': {const r=state.results.find(x=>x.id===id),exam=examById(r?.examId);if(!r||!exam)return;const name=`${exam.code}-Scorecard.pdf`;downloadPdf(name,[exam.name,'SCORECARD',`Candidate: ${state.profile.name}`,`Score: ${r.score}/${r.maxScore}`,`Cut-off: ${r.cutoff}`,`Percentile: ${r.percentile}`,`Rank: ${r.rank}`,`Status: ${r.status.toUpperCase()}`,...r.sectionScores.map(s=>`${s[0]}: ${s[1]}/${s[2]}`)]);addDownload(name,'Scorecard','184 KB');save();toast('Scorecard downloaded',name,'success');break;}
      case 'add-task': openTaskForm();break;
      case 'toggle-task': {const t=state.tasks.find(x=>x.id===id);if(t){t.done=!t.done;t.progress=t.done?100:50;t.state=t.done?'Done':'In progress';save();render();toast(t.done?'Task completed':'Task reopened',t.title,'success')}break;}
      case 'add-session': openSessionForm();break;
      case 'add-session-date': openSessionForm(null,el.dataset.date);break;
      case 'toggle-session': {const s=state.plannerSessions.find(x=>x.id===id);if(s){s.done=!s.done;save();render();toast(s.done?'Session completed':'Session reopened',s.topic,'success')}break;}
      case 'edit-session': openSessionForm(state.plannerSessions.find(x=>x.id===id));break;
      case 'delete-session': if(confirm('Delete this study session?')){state.plannerSessions=state.plannerSessions.filter(x=>x.id!==id);save();render();toast('Session deleted','','success')}break;
      case 'prev-week': {const d=new Date(state.plannerWeekStart+'T12:00:00');d.setDate(d.getDate()-7);state.plannerWeekStart=isoDate(d);save();render();break;}
      case 'next-week': {const d=new Date(state.plannerWeekStart+'T12:00:00');d.setDate(d.getDate()+7);state.plannerWeekStart=isoDate(d);save();render();break;}
      case 'today-week': state.plannerWeekStart='2026-08-03';save();render();break;
      case 'smart-plan': addSmartPlan();break;
      case 'mock-tab': ui.mockTab=el.dataset.tab;renderMockTests();bindPageInputs();break;
      case 'start-test': startTest(id);break;
      case 'custom-test': startTest(604);toast('Custom test generated','A balanced five-question practice test is ready.','success');break;
      case 'review-attempt': {const a=state.attempts.find(x=>x.id===id),t=state.mockTests.find(x=>x.id===a?.testId);openModal('Attempt review',t?.title||'Mock Test',`<section class="grid grid-4">${statBox('Score',`${a.score}/${a.total}`,'Questions')}${statBox('Accuracy',`${a.accuracy}%`,'Correct attempts')}${statBox('Time',formatTime(a.time),'Total time')}${statBox('Percentile',`${a.percentile}%`,'Estimated rank')}</section><div class="card card-pad" style="margin-top:15px"><h3>Recommended action</h3><p style="color:var(--muted)">${a.accuracy<75?'Review incorrect concepts and retake a similar sectional test.':'Maintain speed and increase full-length mock frequency.'}</p></div>`);break;}
      case 'test-question': ui.currentQuestion=Number(el.dataset.index);renderTestModal();break;
      case 'test-option': ui.testAnswers[ui.currentQuestion]=Number(el.dataset.index);renderTestModal();break;
      case 'test-prev': ui.currentQuestion=Math.max(0,ui.currentQuestion-1);renderTestModal();break;
      case 'test-next': ui.currentQuestion=Math.min(testQuestions.length-1,ui.currentQuestion+1);renderTestModal();break;
      case 'test-clear': delete ui.testAnswers[ui.currentQuestion];renderTestModal();break;
      case 'submit-test': if(Object.keys(ui.testAnswers).length<testQuestions.length&&!confirm('Some questions are unanswered. Submit anyway?'))return;submitTest(false);break;
      case 'go-test-history': closeModal();ui.mockTab='history';navigate('Mock Tests');break;
      case 'log-study': openStudyLog();break;
      case 'download-report': {const mins=state.plannerSessions.filter(s=>s.done).reduce((a,s)=>a+s.duration,0);const name='Weekly-Study-Report.pdf';downloadPdf(name,['WEEKLY STUDY REPORT',`Candidate: ${state.profile.name}`,`Completed study time: ${Math.floor(mins/60)}h ${mins%60}m`,`Mock tests attempted: ${state.attempts.length}`,`Average subject progress: ${Math.round(state.subjects.reduce((a,s)=>a+s.progress,0)/state.subjects.length)}%`,...state.subjects.map(s=>`${s.name}: ${s.progress}% progress, ${s.accuracy}% accuracy`)]);addDownload(name,'Report','392 KB');toast('Study report downloaded',name,'success');break;}
      case 'add-bookmark': openBookmarkForm();break;
      case 'remove-bookmark': state.bookmarks=state.bookmarks.filter(x=>x.id!==id);save();render();toast('Bookmark removed','','success');break;
      case 'open-bookmark': {const b=state.bookmarks.find(x=>x.id===id);if(!b)return;const map={'Syllabus':'Syllabus','Paper':'Previous Papers','Current Affairs':'Current Affairs','Strategy':'Topper Strategy','Cut Off':'Cut Offs'};navigate('Resources',{resource:map[b.type]||'Syllabus'});break;}
      case 'new-note': {const n={id:uniqueId(),title:'Untitled note',body:'',tag:'General',updated:new Date().toISOString(),pinned:false};state.notes.unshift(n);ui.selectedNoteId=n.id;save();render();setTimeout(()=>$('#noteTitle')?.select(),30);break;}
      case 'select-note': ui.selectedNoteId=id;renderNotes();bindPageInputs();break;
      case 'pin-note': {const n=state.notes.find(x=>x.id===id);n.pinned=!n.pinned;n.updated=new Date().toISOString();save();render();break;}
      case 'delete-note': if(confirm('Delete this note?')){state.notes=state.notes.filter(x=>x.id!==id);ui.selectedNoteId=state.notes[0]?.id||null;save();render();toast('Note deleted','','success')}break;
      case 'open-alert': {const a=state.alerts.find(x=>x.id===id);if(!a)return;a.read=true;save();navigate(a.route,{resource:a.resource});break;}
      case 'toggle-alert-read': {const a=state.alerts.find(x=>x.id===id);a.read=!a.read;save();render();break;}
      case 'delete-alert': state.alerts=state.alerts.filter(x=>x.id!==id);save();render();toast('Alert dismissed','','success');break;
      case 'mark-all-read': state.alerts.forEach(a=>a.read=true);save();render();toast('All alerts marked as read','','success');break;
      case 'download-file': {const d=state.downloads.find(x=>x.id===id);if(!d)return;downloadPdf(d.name.endsWith('.pdf')?d.name:d.name.replace(/\.[^.]+$/,'.pdf'),[d.name,`Type: ${d.type}`,`Candidate: ${state.profile.name}`,`Saved: ${fmtDate(d.date)}`,'This is a generated prototype document.']);toast('Download started',d.name,'success');break;}
      case 'remove-download': state.downloads=state.downloads.filter(x=>x.id!==id);save();render();toast('Download removed from history','','success');break;
      case 'clear-downloads': if(confirm('Clear the download history?')){state.downloads=[];save();render();toast('Download history cleared','','success')}break;
      case 'settings-tab': state.activeSettingsTab=el.dataset.tab;save();render();break;
      case 'save-settings': $('#profileForm')?.requestSubmit(); if(!$('#profileForm'))toast('Settings saved','','success');break;
      case 'set-theme': setTheme(el.dataset.theme);render();break;
      case 'test-focus': openModal('Focus test','A short demonstration focus session.',`<div class="progress-ring" style="--value:100"><div><strong>01:00</strong><span>Focus timer</span></div></div><p style="text-align:center;color:var(--muted);margin-top:14px">Wake lock and focus sounds follow your preferences.</p>`,`<button class="btn btn-primary" data-action="close-modal">Finish</button>`);requestWakeLock();break;
      case 'export-data': downloadText('sarkari-aspirant-backup.json',JSON.stringify(state,null,2),'application/json');toast('Backup exported','','success');break;
      case 'import-data': $('#importFile').click();break;
      case 'reset-data': if(confirm('Reset all portal data? This cannot be undone.')){state=clone(defaultState);save();closeModal();render();toast('Portal reset','Original demonstration data restored.','success')}break;
      case 'bookmark-current-resource': {const exists=state.bookmarks.some(b=>b.title===state.activeResource);if(exists){toast('Already bookmarked',state.activeResource,'info');break;}state.bookmarks.unshift({id:uniqueId(),type:state.activeResource==='Previous Papers'?'Paper':state.activeResource==='Topper Strategy'?'Strategy':state.activeResource==='Cut Offs'?'Cut Off':'Syllabus',title:state.activeResource,description:`Saved ${state.activeResource} resource.`,source:'Resources',date:isoDate(TODAY),icon:'▥'});save();toast('Resource bookmarked',state.activeResource,'success');break;}
      case 'toggle-topic': {const t=state.syllabus.find(x=>x.id===id);t.done=!t.done;save();render();toast(t.done?'Topic completed':'Topic reopened',t.topic,'success');break;}
      case 'paper-test': closeModal();navigate('Mock Tests');setTimeout(()=>startTest(601),50);break;
      case 'download-paper': {const name=el.dataset.paper.replace(/[^a-z0-9]+/gi,'-')+'.pdf';downloadPdf(name,[el.dataset.paper,'PREVIOUS YEAR QUESTION PAPER','100 questions','Includes answer key and solution references.']);addDownload(name,'Question Papers','1.8 MB');toast('Paper downloaded',name,'success');break;}
      case 'start-current-quiz': startCurrentQuiz();break;
      case 'bookmark-news': state.bookmarks.unshift({id:uniqueId(),type:'Current Affairs',title:el.dataset.title,description:'Saved from the daily current-affairs feed.',source:'Current Affairs',date:isoDate(TODAY),icon:'◎'});save();toast('Current affair saved','','success');break;
      case 'add-calendar-event': openCalendarForm();break;
      case 'calendar-day': openCalendarForm(el.dataset.date);break;
      case 'join-community': toast('Community access ready','In production, this would open the verified community invite.','success');break;
      case 'apply-strategy': addSmartPlan();navigate('Study Planner');break;
      case 'estimate-cutoff': {const score=Number($('#cutoffScore').value),cat=$('#cutoffCategory').value,cut={UR:158,OBC:154,SC:141,ST:131}[cat],buffer=score-cut;$('#cutoffResult').innerHTML=`<div class="card card-pad" style="border-color:${buffer>=0?'var(--success)':'var(--danger)'}"><strong style="color:${buffer>=0?'var(--success)':'var(--danger)'}">${buffer>=0?`You are ${buffer} marks above the recent ${cat} cut-off.`:`You are ${Math.abs(buffer)} marks below the recent ${cat} cut-off.`}</strong><p style="margin:5px 0 0;color:var(--muted)">Treat this only as a planning estimate, not a prediction.</p></div>`;break;}
    }
  });

  document.addEventListener('submit', e => {
    e.preventDefault();const f=e.target,fd=new FormData(f);
    if(f.id==='examForm'){
      const id=Number(f.dataset.id),existing=examById(id);const name=fd.get('name'),code=name.split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();const data={code,name,board:fd.get('board'),date:fd.get('date'),stage:fd.get('stage'),priority:fd.get('priority'),prep:Number(fd.get('prep')),reminder:Number(fd.get('reminder')),application:fd.get('stage')==='completed'?'Completed':'Not started',logo:existing?.logo||['#155eef','#7f56d9'],target:existing?.target||false};if(existing)Object.assign(existing,data);else state.exams.push({id:uniqueId(),...data});save();closeModal();render();toast(existing?'Exam updated':'Exam added',name,'success');
    }
    if(f.id==='applicationManageForm'){const a=state.applications.find(x=>x.id===Number(f.dataset.id));a.applicationNo=fd.get('applicationNo');a.stage=fd.get('stage');a.fee=fd.get('fee');a.lastUpdated=isoDate(TODAY);for(const k of ['photo','signature','id','certificate'])a.documents[k]=fd.get(`doc_${k}`)==='on';save();closeModal();render();toast('Application updated','','success');}
    if(f.id==='applicationForm'){state.applications.push({id:uniqueId(),examId:Number(fd.get('examId')),applicationNo:fd.get('applicationNo'),stage:fd.get('stage'),fee:'Pending',lastUpdated:isoDate(TODAY),documents:{photo:false,signature:false,id:false,certificate:false}});save();closeModal();render();toast('Application added','','success');}
    if(f.id==='taskForm'){state.tasks.push({id:uniqueId(),title:fd.get('title'),date:isoDate(TODAY),done:false,progress:0,state:fd.get('state'),category:fd.get('category')});save();closeModal();render();toast('Task added',fd.get('title'),'success');}
    if(f.id==='sessionForm'){const id=Number(f.dataset.id),existing=state.plannerSessions.find(x=>x.id===id);const data={date:fd.get('date'),time:fd.get('time'),duration:Number(fd.get('duration')),subject:fd.get('subject'),topic:fd.get('topic'),type:fd.get('type'),done:existing?.done||false};if(existing)Object.assign(existing,data);else state.plannerSessions.push({id:uniqueId(),...data});save();closeModal();render();toast(existing?'Session updated':'Session added',data.topic,'success');}
    if(f.id==='bookmarkForm'){state.bookmarks.unshift({id:uniqueId(),type:fd.get('type'),title:fd.get('title'),description:fd.get('description'),source:fd.get('source'),date:isoDate(TODAY),icon:'♧'});save();closeModal();render();toast('Bookmark added','','success');}
    if(f.id==='profileForm'){state.profile.name=fd.get('name');state.profile.email=fd.get('email');state.profile.phone=fd.get('phone');state.profile.state=fd.get('state');state.profile.language=fd.get('language');state.profile.target=fd.get('target');save();render();toast('Profile updated','','success');}
    if(f.id==='currentQuizForm'){let score=0;quizQuestions.forEach((q,i)=>{if(Number(fd.get(`q${i}`))===q.answer)score++});state.currentAffairsQuizScore=score;save();closeModal();render();toast('Quiz completed',`${score}/5 correct answers.`,'success');}
    if(f.id==='calendarForm'){state.plannerSessions.push({id:uniqueId(),date:fd.get('date'),time:fd.get('time'),duration:15,subject:'Weekly Review',topic:fd.get('topic'),type:'Review',done:false});state.alerts.unshift({id:uniqueId(),type:'Reminder',title:fd.get('topic'),description:`Reminder scheduled for ${fmtDate(fd.get('date'))} at ${fd.get('time')}.`,time:new Date().toISOString(),read:false,route:'Resources',resource:'Exam Calendar'});save();closeModal();render();toast('Calendar reminder added','','success');}
    if(f.id==='studyLogForm'){state.plannerSessions.push({id:uniqueId(),date:fd.get('date'),time:'Completed',duration:Number(fd.get('duration')),subject:fd.get('subject'),topic:fd.get('topic'),type:'Study',done:true});const s=state.subjects.find(x=>x.name===fd.get('subject'));if(s)s.hours=Number((s.hours+Number(fd.get('duration'))/60).toFixed(1));save();closeModal();render();toast('Study time logged','','success');}
    if(f.id==='resultCheckForm'){closeModal();toast('Result check saved','No new official result was found for this demo lookup.','info');}
  });

  $('#globalSearch').addEventListener('input',e=>renderSearch(e.target.value));
  $('#globalSearch').addEventListener('focus',e=>renderSearch(e.target.value));
  $('#themeToggle').addEventListener('click',()=>{setTheme(state.theme==='light'?'dark':'light');render()});
  $('#collapseSidebar').addEventListener('click',()=>{state.compactSidebar=!state.compactSidebar;$('#sidebar').classList.toggle('compact',state.compactSidebar);save()});
  $('#mobileMenu').addEventListener('click',()=>{$('#sidebar').classList.add('mobile-open');$('#overlay').classList.add('open')});
  $('#overlay').addEventListener('click',()=>{closeModal();closeSidebar()});
  $('#importFile').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const imported=JSON.parse(reader.result);state=Object.assign(clone(defaultState),imported);save();render();toast('Backup imported','','success')}catch{toast('Import failed','The selected file is not a valid backup.','warning')}};reader.readAsText(file);e.target.value=''});
  document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();$('#globalSearch').focus()}if(e.key==='Escape'){closeModal();closeSidebar();$('#searchResults').classList.remove('open')}});
  document.addEventListener('click',e=>{if(!e.target.closest('.global-search'))$('#searchResults').classList.remove('open')});

  document.documentElement.dataset.theme=state.theme;
  $('#sidebar').classList.toggle('compact',state.compactSidebar);
  render();
})();

</script>
</body>
</html>
